<script>
const key='travel-split-v1'; let state=JSON.parse(localStorage.getItem(key)||'null')||{people:['鹅友1号','鹅','鹅友2号','鹅友3号'],bills:[{id:'b1',merchant:"Grabb'Jim's",date:'2026-10-12',category:'餐饮',payer:'鹅友1号',tax:16.92,tip:33.23,tipFor:'all',items:[{id:'i1',name:'SCAMPI DI MARE LINGUINE',amount:44,people:['鹅友1号']},{id:'i2',name:'FRUTTI DI MAREROSSO',amount:40,people:['鹅友2号']},{id:'i3',name:'ALOHA FLAME BURGER',amount:29,people:['鹅']},{id:'i4',name:'FILET ROYALE',amount:56,people:['鹅友3号']}]}]};if(!state.trips){state={trips:[{id:crypto.randomUUID(),name:'加州海岸线',dates:'2026.10.10 — 10.14',people:state.people||[],bills:state.bills||[]}],activeTrip:null};state.activeTrip=state.trips[0].id}let trip=()=>state.trips.find(x=>x.id===state.activeTrip)||state.trips[0];Object.defineProperties(state,{people:{get(){return trip().people},set(v){trip().people=v},enumerable:false},bills:{get(){return trip().bills},set(v){trip().bills=v},enumerable:false}});let page='bills',openBill=null,editItem=null;const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(state))}function total(b){return b.items.reduce((a,i)=>a+i.amount,0)+Number(b.tax)+Number(b.tip)}function taxShare(b,i){let sub=b.items.reduce((a,x)=>a+x.amount,0);return sub?b.tax*i.amount/sub:0}function shares(b){let o=Object.fromEntries(state.people.map(p=>[p,0]));b.items.forEach(i=>{let n=i.people.length||1,each=(i.amount+taxShare(b,i))/n;i.people.forEach(p=>o[p]=(o[p]||0)+each)});let tp=b.tipFor==='all'?state.people:[b.tipFor];tp.forEach(p=>o[p]=(o[p]||0)+b.tip/tp.length);return o}function allData(){let paid=Object.fromEntries(state.people.map(p=>[p,0])),owed=Object.fromEntries(state.people.map(p=>[p,0]));state.bills.forEach(b=>{paid[b.payer]=(paid[b.payer]||0)+total(b);let sh=shares(b);Object.entries(sh).forEach(([p,v])=>owed[p]=(owed[p]||0)+v)});return{paid,owed,net:Object.fromEntries(state.people.map(p=>[p,paid[p]-owed[p]]))}}function transfers(){let {net}=allData(),debt=state.people.filter(p=>net[p]<-.005).map(p=>[p,-net[p]]),credit=state.people.filter(p=>net[p]>.005).map(p=>[p,net[p]]),a=[];while(debt.length&&credit.length){let d=debt[0],c=credit[0],v=Math.min(d[1],c[1]);a.push([d[0],c[0],v]);d[1]-=v;c[1]-=v;if(d[1]<.005)debt.shift();if(c[1]<.005)credit.shift()}return a}
function avatar(p){let tones=["sea","sunset","coast","moss","berry","ochre"],name=String(p||"鹅"),tone=[...name].reduce((hash,char)=>(hash*31+char.codePointAt(0))>>>0,7)%tones.length;return `<span class="av av-${tones[tone]}">${esc(name.charAt(0)||name)}</span>`}let tripWorkspaceOpen=false;function enterTrip(id){if(!state.trips.some(x=>x.id===id))return;state.activeTrip=id;page='bills';openBill=null;tripWorkspaceOpen=true;save();render()}function renderTripLanding(){const english=document.documentElement.lang==='en';const rows=state.trips.map(t=>{const people=t.people||[],bills=t.bills||[],sum=bills.reduce((a,b)=>a+total(b),0),date=t.dates||'';return '<article class="hero trip-entry"><button type="button" class="trip-enter" data-enter-trip="'+esc(t.id)+'"><span class="trip-entry-copy"><span class="trip-entry-title"><strong class="trip-name">'+esc(t.name)+'</strong>'+(t.id===state.activeTrip?'<span class="trip-current" data-i18n="currentTrip">当前旅行</span>':'')+'</span><span class="trip-meta">'+(english?bills.length+(bills.length===1?' bill · ':' bills · ')+people.length+(people.length===1?' member':' members'):bills.length+' 笔账单 · '+people.length+' 位同行者')+'</span>'+(date.trim()?'<span class="trip-meta trip-note">'+(english?'Note: ':'备注：')+esc(date.trim())+'</span>':'')+'</span><span class="trip-entry-total"><span data-i18n="tripTotalLabel">旅行总开销</span><b>'+money(sum)+'</b></span></button><button type="button" class="edit-icon-button trip-edit" data-edit-trip="'+esc(t.id)+'" aria-label="编辑旅行" title="编辑旅行"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L19 8.5 15.5 5 4 16.5Z"/><path d="m13.8 6.7 3.5 3.5"/></svg></button></article>'}).join('');$('#tripLanding').innerHTML='<section class="trips-heading"><div><h1 data-i18n="tripsHome">旅行</h1><p data-i18n="tripsSubtitle">选择一段旅行，查看它的账单和成员。</p></div></section><section class="trips-list">'+(rows||'<p class="trips-empty">还没有旅行，请先新建一段旅行。</p>')+'<button type="button" class="create-trip-icon" id="createTrip" data-i18n="createTripAction" aria-label="新建旅行" title="新建旅行"></button></section>'}function render(){const landing=$('#tripLanding'),workspace=$('#workspace'),back=$('#backToTrips');if(landing)landing.hidden=tripWorkspaceOpen;if(workspace)workspace.hidden=!tripWorkspaceOpen;if(back)back.hidden=!tripWorkspaceOpen;document.querySelector('.top')?.classList.toggle('trips-home',!tripWorkspaceOpen);if(!tripWorkspaceOpen){renderTripLanding();return}let t=trip();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(page==='bills')renderBills();if(page==='people')renderPeople();if(page==='settle')renderSettle()}function renderBills(){let tripTotal=state.bills.reduce((a,b)=>a+total(b),0);$('#screen').innerHTML=`<section class="hero"><div><h1>${esc(trip().name)}</h1><p>${state.bills.length} 笔账单 · ${state.people.length} 位同行者</p></div><div><span>旅行总开销</span><b>${money(tripTotal)}</b></div></section><section class="grid"><div class="card"><div class="head"><h2>全部账单</h2><button class="plain" id="addBill2">＋ 添加账单</button></div>${state.bills.length?state.bills.slice().reverse().map(b=>`<div class="bill" data-bill="${b.id}"><div class="bill-top"><div class="shop">${b.category==='餐饮'?'🍝':b.category==='交通'?'🚗':b.category==='门票'?'🎟️':'🧾'}</div><div><div class="shop-name">${esc(b.merchant)}</div><div class="meta">${b.date||'暂无日期'} · ${b.items.length} 项</div></div><div class="bill-total"><small>账单合计</small>${money(total(b))}</div><span class="chev">›</span></div></div>`).join(''):`<div class="empty">还没有账单<b>从第一张收据开始吧</b></div>`}</div><aside class="card"><div class="head"><h2>当前余额</h2><button class="plain" data-go="settle">查看结算</button></div>${balanceHTML()}${settleHTML()}</aside></section>`;$('#addBill2')?.addEventListener('click',showBill);document.querySelectorAll('[data-bill]').forEach(x=>x.onclick=()=>showReceipt(x.dataset.bill));document.querySelector('[data-go]')?.addEventListener('click',()=>{page='settle';render()})}function balanceHTML(){let d=allData(),max=Math.max(...state.people.map(p=>Math.abs(d.net[p])),1);return state.people.map(p=>`<div class="balance"><div class="brow">${avatar(p)}<strong>${esc(p)}</strong><span class="net ${d.net[p]>=0?'gets':'owed'}">${d.net[p]>=0?'应收 ':'应付 '}${money(Math.abs(d.net[p]))}</span></div><div class="bar"><i style="width:${Math.abs(d.net[p])/max*100}%;background:${d.net[p]>=0?'var(--green)':'var(--orange)'}"></i></div><div class="detail">已付 ${money(d.paid[p])} · 应承担 ${money(d.owed[p])}</div></div>`).join('')}function settleHTML(){let t=transfers();return `<div class="settle"><h3>建议这样转账</h3><p>已将所有账单合并，并尽量减少转账次数。</p>${t.length?t.map(x=>`<div class="transfer"><span>${esc(x[0])}</span><span>→</span><span>${esc(x[1])}</span><b>${money(x[2])}</b></div>`).join(''):'<p>大家已经结清。</p>'}</div>`}
function renderPeople(){let d=allData();$('#screen').innerHTML=`<section class="hero"><div><h1>同行成员</h1><p>管理旅行成员与各自的付款、消费情况</p></div><div class="people">${state.people.map(avatar).join('')}</div></section><section class="card" style="margin-top:20px"><div class="head"><h2>${state.people.length} 位成员</h2><button class="plain" id="managePeople">＋ 添加成员</button></div><table class="table"><thead><tr><th>成员</th><th>已付款</th><th>应承担</th><th>余额</th><th></th></tr></thead><tbody>${state.people.map(p=>`<tr><td>${avatar(p)}　<b>${esc(p)}</b></td><td>${money(d.paid[p])}</td><td>${money(d.owed[p])}</td><td class="${d.net[p]>=0?'gets':'owed'}"><b>${d.net[p]>=0?'应收 ':'应付 '}${money(Math.abs(d.net[p]))}</b></td><td><button class="plain rename-person" data-person="${esc(p)}">编辑</button></td></tr>`).join('')}</tbody></table></section>`;$('#managePeople').onclick=()=>$('#peopleDialog').showModal();document.querySelectorAll('.rename-person').forEach(x=>x.onclick=()=>renamePerson(x.dataset.person))}function renderSettle(){let t=transfers(),d=allData();$('#screen').innerHTML=`<section class="hero"><div><h1>旅行结算</h1><p>按以下转账后，所有人的余额都会归零。</p></div><div><span>待结算总额</span><b>${money(t.reduce((a,x)=>a+x[2],0))}</b></div></section><section class="grid"><div class="card"><div class="head"><h2>转账清单</h2><button class="plain" id="copy">复制清单</button></div>${t.length?t.map((x,i)=>`<div class="bill"><div class="bill-top">${avatar(x[0])}<b>${esc(x[0])}</b><span class="chev">→</span>${avatar(x[1])}<b>${esc(x[1])}</b><div class="bill-total">${money(x[2])}</div></div></div>`).join(''):`<div class="empty">无需转账，已经全部结清。</div>`}</div><aside class="card"><div class="head"><h2>结算前余额</h2></div>${balanceHTML()}</aside></section>`;$('#copy')?.addEventListener('click',()=>{navigator.clipboard?.writeText(t.map(x=>`${x[0]} → ${x[1]} ${money(x[2])}`).join('\n'));toast('转账清单已复制')})}
function showBill(){let sel=state.people.map(p=>`<option>${esc(p)}</option>`).join('');$('#payerSelect').innerHTML=sel;$('#tipSelect').innerHTML='<option value="all">全体成员均分</option>'+sel;$('#billForm').date.value=new Date().toISOString().slice(0,10);$('#billDialog').showModal()}function showReceipt(id){openBill=state.bills.find(b=>b.id===id);let b=openBill,sh=shares(b);$('#screen').innerHTML=`<button class="back" id="back">← 返回账单</button><section class="grid"><div class="card"><div class="head"><div><h1 class="receipt-title">${esc(b.merchant)}</h1><div class="receipt-info">${b.date||'暂无日期'} · ${b.category} · ${esc(b.payer)}先付</div></div></div><table class="table receipt-table"><thead><tr><th>消费项目</th><th>税前金额</th><th>分摊成员</th><th></th></tr></thead><tbody>${b.items.map(i=>`<tr><td><b>${esc(i.name)}</b><br><span class="meta">含税 ${money(i.amount+taxShare(b,i))}</span></td><td>${money(i.amount)}</td><td><div class="receipt-people">${i.people.map(p=>avatar(p)).join('')}</div></td><td><button type="button" class="edit-icon-button edit" data-item="${i.id}" aria-label="编辑消费项目 ${esc(i.name)}" title="编辑消费项目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L19 8.5 15.5 5 4 16.5Z"/><path d="m13.8 6.7 3.5 3.5"/></svg></button></td></tr>`).join('')}</tbody></table><button class="btn-add-item" id="addItem">＋ 添加项目</button><div class="line"><span>商品小计</span><span>${money(b.items.reduce((a,i)=>a+i.amount,0))}</span></div><div class="line"><span>税额（按税前金额比例分摊）</span><span>${money(b.tax)}</span></div><div class="line"><span>小费 / 服务费</span><span>${money(b.tip)}</span></div><div class="line total"><span>账单合计</span><span>${money(total(b))}</span></div></div><aside class="card"><div class="head"><h2>这张账单的分摊</h2></div><div class="splitbox">${Object.entries(sh).filter(([,v])=>v>.004).map(([p,v])=>`<div class="line"><div class="split-person">${avatar(p)}<b>${esc(p)}</b></div><span>${money(v)}</span></div>`).join('')}</div></aside></section>`;$('#back').onclick=()=>{page='bills';render()};$('#addItem').onclick=()=>showItem();document.querySelectorAll('.edit').forEach(x=>x.onclick=()=>showItem(x.dataset.item));}function updateConsumerCount(){const count=document.querySelectorAll('#personChecks input:checked').length,english=document.documentElement.lang==='en';$('#consumerCount').textContent=english?count+' selected':'已选 '+count+' 人'}
$('#personChecks').addEventListener('change',updateConsumerCount);$('#languageToggle').addEventListener('click',()=>setTimeout(updateConsumerCount,0));

let editingTripId=null;function newTrip(){editingTripId=null;$('#tripDialogTitle').textContent='新建旅行';$('#tripSubmit').textContent='创建';$('#deleteTrip').hidden=true;$('#tripForm').reset();tripDialog.showModal()}function editTrip(id){let t=state.trips.find(x=>x.id===(id||state.activeTrip))||trip();editingTripId=t.id;$('#tripDialogTitle').textContent='编辑旅行';$('#tripSubmit').textContent='保存';$('#deleteTrip').hidden=false;$('#tripForm').tripName.value=t.name;$('#tripForm').tripDates.value=t.dates==='无备注'?'':(t.dates||'');tripDialog.showModal()}let editingPerson=null;function renamePerson(old){editingPerson=old;$('#personDialogTitle').textContent='编辑成员';$('#personForm').personName.value=old;$('#deletePersonFromEdit').disabled=false;personDialog.showModal()}
$('#backToTrips').onclick=()=>{tripWorkspaceOpen=false;openBill=null;render()};$('#tripLanding').addEventListener('pointerdown',e=>{const button=e.target.closest('.trip-enter');if(!button)return;const rect=button.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,radius=Math.ceil(Math.max(Math.hypot(x,y),Math.hypot(rect.width-x,y),Math.hypot(x,rect.height-y),Math.hypot(rect.width-x,rect.height-y)));button.style.setProperty('--ripple-x',x+'px');button.style.setProperty('--ripple-y',y+'px');button.style.setProperty('--ripple-size',radius*2+'px');button.classList.remove('is-rippling');void button.offsetWidth;button.classList.add('is-rippling');button.dataset.rippleTime=Date.now()});$('#tripLanding').addEventListener('click',e=>{const create=e.target.closest('#createTrip');if(create){newTrip();return}const edit=e.target.closest('[data-edit-trip]');if(edit){editTrip(edit.dataset.editTrip);return}const enter=e.target.closest('[data-enter-trip]');if(enter){const rippleTime=Number(enter.dataset.rippleTime||0);delete enter.dataset.rippleTime;if(rippleTime&&Date.now()-rippleTime<900)setTimeout(()=>{if(enter.isConnected)enterTrip(enter.dataset.enterTrip)},280);else enterTrip(enter.dataset.enterTrip)}});$('#languageToggle').addEventListener('click',()=>setTimeout(render,0));$('#refreshPage').onclick=()=>{const hasUnsavedForm=!!document.querySelector('dialog[open] form');const english=document.documentElement.lang==='en';if(hasUnsavedForm&&!confirm(english?'Reloading will discard unsaved changes. Continue?':'刷新将丢失尚未保存的修改，确定继续吗？'))return;location.reload()};$('#newBill').onclick=showBill;$('#deletePersonFromEdit').onclick=()=>{if(!editingPerson)return;if(state.people.length===1)return toast('至少保留一位成员');deletePerson(editingPerson)};document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>{page=x.dataset.page;render()});$('#billForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),b={id:crypto.randomUUID(),merchant:f.get('merchant'),payer:f.get('payer'),category:f.get('category'),date:f.get('date'),tax:Number(f.get('tax')),tip:Number(f.get('tip')),tipFor:f.get('tipFor'),items:[]};state.bills.push(b);save();$('#billDialog').close();openBill=b;showReceipt(b.id);showItem()});$('#itemForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),people=[...document.querySelectorAll('#personChecks input:checked')].map(x=>x.value);if(!people.length)return toast('请选择至少一位消费人');let i={id:editItem?.id||crypto.randomUUID(),name:f.get('name'),amount:Number(f.get('amount')),people:people};if(editItem)openBill.items=openBill.items.map(x=>x.id===i.id?i:x);else openBill.items.push(i);save();$('#itemDialog').close();showReceipt(openBill.id)});$('#peopleForm').addEventListener('submit',e=>{e.preventDefault();let p=new FormData(e.target).get('person').trim();if(!p)return;if(state.people.includes(p))return toast('该成员已经存在');state.people.push(p);save();e.target.reset();$('#peopleDialog').close();render()});$('#tripForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('tripName').trim(),dates=f.get('tripDates').trim();if(!name)return toast('请输入旅行名称');if(editingTripId){let t=state.trips.find(x=>x.id===editingTripId);if(t){t.name=name;t.dates=dates;}}else{let t={id:crypto.randomUUID(),name,dates,people:[],bills:[]};state.trips.push(t);state.activeTrip=t.id;page='people';tripWorkspaceOpen=true;}save();render();tripDialog.close();if(!editingTripId)$('#peopleDialog').showModal();});$('#personForm').addEventListener('submit',e=>{e.preventDefault();let n=e.target.personName.value.trim();if(!n)return toast('请输入成员名称');if(!editingPerson)return;if(n!==editingPerson&&state.people.includes(n))return toast('该成员已经存在');let pos=state.people.indexOf(editingPerson);state.people[pos]=n;state.bills.forEach(b=>{if(b.payer===editingPerson)b.payer=n;if(b.tipFor===editingPerson)b.tipFor=n;b.items.forEach(i=>i.people=i.people.map(p=>p===editingPerson?n:p))});save();render();personDialog.close();editingPerson=null;});render();
</script><script>
/* CRUD enhancements for trips, people, and bill metadata. */
let editingBill=null;
const baseShowBill=showBill, baseShowReceipt=showReceipt, baseRenderPeople=renderPeople;
function syncBillDateDisplay(input){const output=input.closest('.field').querySelector('.date-value-display'),value=input.value;output.textContent=value?new Date(value+'T00:00:00').toLocaleDateString(document.documentElement.lang==='en'?'en-US':'zh-CN',{year:'numeric',month:'long',day:'numeric'}):'';input.classList.toggle('is-empty',!value)}
showBill=function(b){
  editingBill=b||null; $('#deleteBillFromEdit').hidden=!b; const peopleOptions=state.people.map(p=>`<option>${esc(p)}</option>`).join('');
  $('#payerSelect').innerHTML=peopleOptions; $('#tipSelect').innerHTML='<option value="all">全体成员均分</option>'+peopleOptions;
  $('#billDialogTitle').textContent=b?'编辑账单':'新建账单'; $('#billSubmit').textContent=b?'保存修改':'创建并添加项目';
  if(b){$('#billForm').merchant.value=b.merchant;$('#billForm').payer.value=b.payer;$('#billForm').category.value=b.category;$('#billForm').date.value=b.date||'';$('#billForm').taxRate.value=Number(b.taxRate||0);$('#billForm').tax.value=b.tax;$('#billForm').tip.value=b.tip;$('#billForm').tipFor.value=b.tipFor}
  else{$('#billForm').reset();$('#billForm').date.value=new Date().toISOString().slice(0,10);$('#billForm').taxRate.value=0;$('#billForm').tax.value=0;$('#billForm').tip.value=0}
  const billDateInput=$('#billForm').date; syncBillDateDisplay(billDateInput);
  $('#billDialog').showModal();
};
$('#billForm').date.addEventListener('input',e=>syncBillDateDisplay(e.currentTarget));
$('#billForm').date.addEventListener('change',e=>syncBillDateDisplay(e.currentTarget));


showReceipt=function(id){baseShowReceipt(id);let b=openBill;let editButton=document.createElement('button');editButton.type='button';editButton.className='plain';editButton.id='editBill';editButton.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L19 8.5 15.5 5 4 16.5Z"/><path d="m13.8 6.7 3.5 3.5"/></svg><span>编辑账单</span>';$('#screen .head').append(editButton);editButton.onclick=()=>showBill(b);let taxLine=[...document.querySelectorAll('.line')].find(x=>x.firstElementChild?.textContent.startsWith('税额'));if(taxLine)taxLine.insertAdjacentHTML('beforebegin',`<div class="line"><span>当地税率</span><span>${Number(b.taxRate||0).toFixed(2)}%</span></div>`)};
renderPeople=function(){baseRenderPeople();let table=$('.table'),head=table.querySelector('thead tr');head.insertAdjacentHTML('beforeend','<th></th>');[...table.querySelectorAll('tbody tr')].forEach((row,index)=>{let p=state.people[index];row.insertAdjacentHTML('beforeend',`<td><button class="plain danger delete-person" data-person="${esc(p)}">删除</button></td>`)});};
function deleteTrip(){let t=state.trips.find(x=>x.id===editingTripId)||trip();$('#deleteTripCopy').textContent=`确定删除“${t.name}”及其全部账单和成员吗？此操作无法撤销。`;$('#deleteTripDialog').showModal()}function confirmDeleteTrip(){let t=state.trips.find(x=>x.id===editingTripId);if(!t)return;const stayOnTripList=!tripWorkspaceOpen;state.trips=state.trips.filter(x=>x.id!==t.id);if(!state.trips.length){let replacement={id:crypto.randomUUID(),name:'新旅行',dates:'',people:['我'],bills:[]};state.trips.push(replacement)}if(!state.trips.some(x=>x.id===state.activeTrip))state.activeTrip=state.trips[0].id;page='bills';tripWorkspaceOpen=!stayOnTripList;$('#deleteTripDialog').close();$('#tripDialog').close();save();render()}let pendingPersonDelete=null;
