</style></head><body><div class="app"><header class="top"><div class="logo">✦</div><div class="brand">与鹅同行</div><select id="tripSwitcher" aria-label="切换旅行"></select><button class="plain" id="editTrip">编辑旅行</button></header><div class="layout"><aside class="side"><div class="trip-name" id="tripName">加州海岸线</div><div class="dates" id="tripDates">2026.10.10 — 10.14 · USD</div><button class="nav active" data-page="bills">账单</button><button class="nav" data-page="people">成员</button><button class="nav" data-page="settle">结算</button><button class="new" id="newBill">＋ 新建账单</button><button class="plain" id="newTrip" style="margin:14px 5px 0">＋ 新建旅行</button></aside><main class="screen" id="screen"></main></div></div>
<dialog id="billDialog"><form class="modal" id="billForm"><h2 id="billDialogTitle">新建账单</h2><div class="form"><label class="field wide">商家 / 项目名称<input required name="merchant" placeholder="例如：Old Fisherman's Grotto"></label><label class="field">谁先付款？<select name="payer" id="payerSelect"></select></label><label class="field">类别<select name="category"><option>餐饮</option><option>交通</option><option>门票</option><option>住宿</option><option>其他</option></select></label><label class="field">日期<input name="date" type="date" required></label><label class="field">当地税率（%）<input name="taxRate" type="number" min="0" step="0.01" value="0" placeholder="例如：9.25"></label><label class="field">账单实际税额（$）<input name="tax" type="number" min="0" step="0.01" value="0"></label><label class="field">小费 / 服务费（$）<input name="tip" type="number" min="0" step="0.01" value="0"></label><label class="field">小费承担者<select name="tipFor" id="tipSelect"><option value="all">全体成员均分</option></select></label></div><div class="actions"><button type="button" class="plain danger" id="deleteBillFromEdit" hidden>删除账单</button><button type="button" class="cancel" onclick="billDialog.close()">取消</button><button class="submit" id="billSubmit">创建并添加项目</button></div></form></dialog>
<dialog id="itemDialog"><form class="modal" id="itemForm"><h2 id="itemTitle">添加消费项目</h2><div class="form"><label class="field wide">项目名称<input required name="name" placeholder="例如：Lobster Risotto"></label><label class="field">税前价格（$）<input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></label><label class="field">分摊方式<select name="split" id="splitType"><option value="equal">消费人均分</option><option value="single">一人承担</option></select></label><div class="field wide"><span>消费人</span><div id="personChecks" class="checks"></div></div></div><div class="actions"><button type="button" class="plain danger" id="deleteItemFromEdit" hidden>删除项目</button><button type="button" class="cancel" onclick="itemDialog.close()">取消</button><button class="submit">保存项目</button></div></form></dialog>
<dialog id="peopleDialog"><form class="modal" id="peopleForm"><h2>管理成员</h2><div class="form"><label class="field wide">新增成员<input name="person" placeholder="输入昵称"></label></div><div class="actions"><button type="button" class="cancel" onclick="peopleDialog.close()">关闭</button><button class="submit">添加成员</button></div></form></dialog><dialog id="tripDialog"><form class="modal" id="tripForm"><h2 id="tripDialogTitle">新建旅行</h2><div class="form"><label class="field wide">旅行名称<input name="tripName" placeholder="例如：加州海岸线"></label><label class="field">备注<input name="tripDates" type="text" placeholder="例如：日期/分工/规则/其他"></label></div><div class="actions"><button type="button" class="plain danger" id="deleteTrip" hidden>删除旅行</button><button type="button" class="cancel" onclick="tripDialog.close()">取消</button><button class="submit" id="tripSubmit">保存</button></div></form></dialog><dialog id="personDialog"><form class="modal" id="personForm"><h2 id="personDialogTitle">编辑成员</h2><div class="form"><label class="field wide">成员名称<input name="personName" placeholder="输入昵称"></label></div><div class="actions"><button type="button" class="plain danger" id="deletePersonFromEdit">移除成员</button><button type="button" class="cancel" onclick="personDialog.close()">取消</button><button class="submit" id="personSubmit">保存</button></div></form></dialog><dialog id="deletePersonDialog" aria-labelledby="deletePersonTitle"><div class="modal"><div class="confirm-mark" aria-hidden="true">!</div><h2 id="deletePersonTitle">删除这位成员？</h2><p class="confirm-copy" id="deletePersonCopy">删除后，受影响的历史账单会重新分配。</p><div class="actions"><button type="button" class="cancel" id="cancelDeletePerson">保留成员</button><button type="button" class="submit" id="confirmDeletePerson">删除成员</button></div></div></dialog><dialog id="deleteTripDialog" aria-labelledby="deleteTripTitle"><div class="modal"><div class="confirm-mark" aria-hidden="true">!</div><h2 id="deleteTripTitle">删除这段旅行？</h2><p class="confirm-copy" id="deleteTripCopy">删除后，这段旅行的账单和成员也会一起删除。</p><div class="actions"><button type="button" class="cancel" id="cancelDeleteTrip">保留旅行</button><button type="button" class="submit" id="confirmDeleteTrip">删除旅行</button></div></div></dialog><dialog id="deleteItemDialog" aria-labelledby="deleteItemTitle"><div class="modal"><div class="confirm-mark" aria-hidden="true">!</div><h2 id="deleteItemTitle">删除这个项目？</h2><p class="confirm-copy" id="deleteItemCopy">删除后，该项目会从账单中移除。</p><div class="actions"><button type="button" class="cancel" id="cancelDeleteItem">保留项目</button><button type="button" class="submit" id="confirmDeleteItem">删除项目</button></div></div></dialog><dialog id="deleteBillDialog" aria-labelledby="deleteBillTitle"><div class="modal"><div class="confirm-mark" aria-hidden="true">!</div><h2 id="deleteBillTitle">删除这张账单？</h2><p class="confirm-copy" id="deleteBillCopy">删除后，这张账单及其消费项目都会移除。</p><div class="actions"><button type="button" class="cancel" id="cancelDeleteBill">保留账单</button><button type="button" class="submit" id="confirmDeleteBill">删除账单</button></div></div></dialog><div id="toast" class="toast"></div>
<script>
const key='travel-split-v1'; let state=JSON.parse(localStorage.getItem(key)||'null')||{people:['鹅友1号','鹅','鹅友2号','鹅友3号'],bills:[{id:'b1',merchant:"Grabb'Jim's",date:'2026-10-12',category:'餐饮',payer:'鹅友1号',tax:16.92,tip:33.23,tipFor:'all',items:[{id:'i1',name:'SCAMPI DI MARE LINGUINE',amount:44,people:['鹅友1号']},{id:'i2',name:'FRUTTI DI MAREROSSO',amount:40,people:['鹅友2号']},{id:'i3',name:'ALOHA FLAME BURGER',amount:29,people:['鹅']},{id:'i4',name:'FILET ROYALE',amount:56,people:['鹅友3号']}]}]};if(!state.trips){state={trips:[{id:crypto.randomUUID(),name:'加州海岸线',dates:'2026.10.10 — 10.14',people:state.people||[],bills:state.bills||[]}],activeTrip:null};state.activeTrip=state.trips[0].id}let trip=()=>state.trips.find(x=>x.id===state.activeTrip)||state.trips[0];Object.defineProperties(state,{people:{get(){return trip().people},set(v){trip().people=v},enumerable:false},bills:{get(){return trip().bills},set(v){trip().bills=v},enumerable:false}});let page='bills',openBill=null,editItem=null;const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(state))}function total(b){return b.items.reduce((a,i)=>a+i.amount,0)+Number(b.tax)+Number(b.tip)}function taxShare(b,i){let sub=b.items.reduce((a,x)=>a+x.amount,0);return sub?b.tax*i.amount/sub:0}function shares(b){let o=Object.fromEntries(state.people.map(p=>[p,0]));b.items.forEach(i=>{let n=i.people.length||1,each=(i.amount+taxShare(b,i))/n;i.people.forEach(p=>o[p]=(o[p]||0)+each)});let tp=b.tipFor==='all'?state.people:[b.tipFor];tp.forEach(p=>o[p]=(o[p]||0)+b.tip/tp.length);return o}function allData(){let paid=Object.fromEntries(state.people.map(p=>[p,0])),owed=Object.fromEntries(state.people.map(p=>[p,0]));state.bills.forEach(b=>{paid[b.payer]=(paid[b.payer]||0)+total(b);let sh=shares(b);Object.entries(sh).forEach(([p,v])=>owed[p]=(owed[p]||0)+v)});return{paid,owed,net:Object.fromEntries(state.people.map(p=>[p,paid[p]-owed[p]]))}}function transfers(){let {net}=allData(),debt=state.people.filter(p=>net[p]<-.005).map(p=>[p,-net[p]]),credit=state.people.filter(p=>net[p]>.005).map(p=>[p,net[p]]),a=[];while(debt.length&&credit.length){let d=debt[0],c=credit[0],v=Math.min(d[1],c[1]);a.push([d[0],c[0],v]);d[1]-=v;c[1]-=v;if(d[1]<.005)debt.shift();if(c[1]<.005)credit.shift()}return a}
function avatar(p){let tones=["sea","sunset","coast","moss","berry","ochre"],name=String(p||"鹅"),tone=[...name].reduce((hash,char)=>(hash*31+char.codePointAt(0))>>>0,7)%tones.length;return `<span class="av av-${tones[tone]}">${esc(name.charAt(0)||name)}</span>`}function render(){let t=trip();$('#tripSwitcher').innerHTML=state.trips.map(x=>`<option value="${x.id}" ${x.id===state.activeTrip?'selected':''}>${esc(x.name)}</option>`).join('');$('#tripName').textContent=t.name;$('#tripDates').textContent=(t.dates||'无备注')+' · USD';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(page==='bills')renderBills();if(page==='people')renderPeople();if(page==='settle')renderSettle()}function renderBills(){let tripTotal=state.bills.reduce((a,b)=>a+total(b),0);$('#screen').innerHTML=`<section class="hero"><div><h1>${esc(trip().name)}</h1><p>${state.bills.length} 笔账单 · ${state.people.length} 位同行者</p></div><div><span>旅行总开销</span><b>${money(tripTotal)}</b></div></section><section class="grid"><div class="card"><div class="head"><h2>全部账单</h2><button class="plain" id="addBill2">＋ 添加账单</button></div>${state.bills.length?state.bills.slice().reverse().map(b=>`<div class="bill" data-bill="${b.id}"><div class="bill-top"><div class="shop">${b.category==='餐饮'?'🍝':b.category==='交通'?'🚗':b.category==='门票'?'🎟️':'🧾'}</div><div><div class="shop-name">${esc(b.merchant)}</div><div class="meta">${b.date||'暂无日期'} · ${esc(b.payer)}先付 · ${b.items.length} 项</div></div><div class="bill-total"><small>账单合计</small>${money(total(b))}</div><span class="chev">›</span></div></div>`).join(''):`<div class="empty">还没有账单<b>从第一张收据开始吧</b></div>`}</div><aside class="card"><div class="head"><h2>当前余额</h2><button class="plain" data-go="settle">查看结算</button></div>${balanceHTML()}${settleHTML()}</aside></section>`;$('#addBill2')?.addEventListener('click',showBill);document.querySelectorAll('[data-bill]').forEach(x=>x.onclick=()=>showReceipt(x.dataset.bill));document.querySelector('[data-go]')?.addEventListener('click',()=>{page='settle';render()})}function balanceHTML(){let d=allData(),max=Math.max(...state.people.map(p=>Math.abs(d.net[p])),1);return state.people.map(p=>`<div class="balance"><div class="brow">${avatar(p)}<strong>${esc(p)}</strong><span class="net ${d.net[p]>=0?'gets':'owed'}">${d.net[p]>=0?'应收 ':'应付 '}${money(Math.abs(d.net[p]))}</span></div><div class="bar"><i style="width:${Math.abs(d.net[p])/max*100}%;background:${d.net[p]>=0?'var(--green)':'var(--orange)'}"></i></div><div class="detail">已付 ${money(d.paid[p])} · 应承担 ${money(d.owed[p])}</div></div>`).join('')}function settleHTML(){let t=transfers();return `<div class="settle"><h3>建议这样转账</h3><p>已将所有账单合并，并尽量减少转账次数。</p>${t.length?t.map(x=>`<div class="transfer"><span>${esc(x[0])}</span><span>→</span><span>${esc(x[1])}</span><b>${money(x[2])}</b></div>`).join(''):'<p>大家已经结清。</p>'}</div>`}
function renderPeople(){let d=allData();$('#screen').innerHTML=`<section class="hero"><div><h1>同行成员</h1><p>管理旅行成员与各自的付款、消费情况</p></div><div class="people">${state.people.map(avatar).join('')}</div></section><section class="card" style="margin-top:20px"><div class="head"><h2>${state.people.length} 位成员</h2><button class="plain" id="managePeople">＋ 添加成员</button></div><table class="table"><thead><tr><th>成员</th><th>已付款</th><th>应承担</th><th>余额</th><th></th></tr></thead><tbody>${state.people.map(p=>`<tr><td>${avatar(p)}　<b>${esc(p)}</b></td><td>${money(d.paid[p])}</td><td>${money(d.owed[p])}</td><td class="${d.net[p]>=0?'gets':'owed'}"><b>${d.net[p]>=0?'应收 ':'应付 '}${money(Math.abs(d.net[p]))}</b></td><td><button class="plain rename-person" data-person="${esc(p)}">编辑</button></td></tr>`).join('')}</tbody></table></section>`;$('#managePeople').onclick=()=>$('#peopleDialog').showModal();document.querySelectorAll('.rename-person').forEach(x=>x.onclick=()=>renamePerson(x.dataset.person))}function renderSettle(){let t=transfers(),d=allData();$('#screen').innerHTML=`<section class="hero"><div><h1>旅行结算</h1><p>按以下转账后，所有人的余额都会归零。</p></div><div><span>待结算总额</span><b>${money(t.reduce((a,x)=>a+x[2],0))}</b></div></section><section class="grid"><div class="card"><div class="head"><h2>转账清单</h2><button class="plain" id="copy">复制清单</button></div>${t.length?t.map((x,i)=>`<div class="bill"><div class="bill-top">${avatar(x[0])}<b>${esc(x[0])}</b><span class="chev">→</span>${avatar(x[1])}<b>${esc(x[1])}</b><div class="bill-total">${money(x[2])}</div></div></div>`).join(''):`<div class="empty">无需转账，已经全部结清。</div>`}</div><aside class="card"><div class="head"><h2>结算前余额</h2></div>${balanceHTML()}</aside></section>`;$('#copy')?.addEventListener('click',()=>{navigator.clipboard?.writeText(t.map(x=>`${x[0]} → ${x[1]} ${money(x[2])}`).join('\n'));toast('转账清单已复制')})}
function showBill(){let sel=state.people.map(p=>`<option>${esc(p)}</option>`).join('');$('#payerSelect').innerHTML=sel;$('#tipSelect').innerHTML='<option value="all">全体成员均分</option>'+sel;$('#billForm').date.value=new Date().toISOString().slice(0,10);$('#billDialog').showModal()}function showReceipt(id){openBill=state.bills.find(b=>b.id===id);let b=openBill,sh=shares(b);$('#screen').innerHTML=`<button class="back" id="back">← 返回账单</button><section class="grid"><div class="card"><div class="head"><div><h1 class="receipt-title">${esc(b.merchant)}</h1><div class="receipt-info">${b.date||'暂无日期'} · ${b.category} · ${esc(b.payer)}先付</div></div></div><table class="table receipt-table"><thead><tr><th>消费项目</th><th>税前金额</th><th>消费人</th><th></th></tr></thead><tbody>${b.items.map(i=>`<tr><td><b>${esc(i.name)}</b><br><span class="meta">含税 ${money(i.amount+taxShare(b,i))}</span></td><td>${money(i.amount)}</td><td><div class="receipt-people">${i.people.map(p=>avatar(p)).join('')}</div></td><td><button class="plain edit" data-item="${i.id}">编辑</button></td></tr>`).join('')}</tbody></table><button class="btn-add-item" id="addItem">＋ 添加项目</button><div class="line"><span>商品小计</span><span>${money(b.items.reduce((a,i)=>a+i.amount,0))}</span></div><div class="line"><span>税额（按税前金额比例分摊）</span><span>${money(b.tax)}</span></div><div class="line"><span>小费 / 服务费</span><span>${money(b.tip)}</span></div><div class="line total"><span>账单合计</span><span>${money(total(b))}</span></div></div><aside class="card"><div class="head"><h2>这张账单的分摊</h2></div><div class="splitbox">${Object.entries(sh).filter(([,v])=>v>.004).map(([p,v])=>`<div class="line"><div class="split-person">${avatar(p)}<b>${esc(p)}</b></div><span>${money(v)}</span></div>`).join('')}</div></aside></section>`;$('#back').onclick=()=>{page='bills';render()};$('#addItem').onclick=()=>showItem();document.querySelectorAll('.edit').forEach(x=>x.onclick=()=>showItem(x.dataset.item));}function showItem(id){editItem=id?openBill.items.find(i=>i.id===id):null;$('#itemTitle').textContent=editItem?'编辑消费项目':'添加消费项目';$('#itemForm').name.value=editItem?.name||'';$('#itemForm').amount.value=editItem?.amount||'';$('#splitType').value=editItem?.people.length===1?'single':'equal';$('#personChecks').innerHTML=state.people.map(p=>`<label class="check"><input type="checkbox" value="${esc(p)}" ${(editItem?.people||[]).includes(p)?'checked':''}>${esc(p)}</label>`).join('');$('#itemDialog').showModal()}function toast(s){let x=$('#toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
let editingTripId=null;function newTrip(){editingTripId=null;$('#tripDialogTitle').textContent='新建旅行';$('#tripSubmit').textContent='创建';$('#deleteTrip').hidden=true;$('#tripForm').reset();tripDialog.showModal()}function editTrip(){let t=trip();editingTripId=t.id;$('#tripDialogTitle').textContent='编辑旅行';$('#tripSubmit').textContent='保存';$('#deleteTrip').hidden=false;$('#tripForm').tripName.value=t.name;$('#tripForm').tripDates.value=t.dates||'';tripDialog.showModal()}let editingPerson=null;function renamePerson(old){editingPerson=old;$('#personDialogTitle').textContent='编辑成员';$('#personForm').personName.value=old;$('#deletePersonFromEdit').disabled=false;personDialog.showModal()}
$('#newBill').onclick=showBill;$('#newTrip').onclick=newTrip;$('#editTrip').onclick=editTrip;$('#deletePersonFromEdit').onclick=()=>{if(!editingPerson)return;if(state.people.length===1)return toast('至少保留一位成员');deletePerson(editingPerson)};$('#tripSwitcher').onchange=e=>{state.activeTrip=e.target.value;page='bills';openBill=null;save();render()};document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>{page=x.dataset.page;render()});$('#billForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),b={id:crypto.randomUUID(),merchant:f.get('merchant'),payer:f.get('payer'),category:f.get('category'),date:f.get('date'),tax:Number(f.get('tax')),tip:Number(f.get('tip')),tipFor:f.get('tipFor'),items:[]};state.bills.push(b);save();$('#billDialog').close();openBill=b;showReceipt(b.id);showItem()});$('#itemForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),people=[...document.querySelectorAll('#personChecks input:checked')].map(x=>x.value);if(!people.length)return toast('请选择至少一位消费人');let i={id:editItem?.id||crypto.randomUUID(),name:f.get('name'),amount:Number(f.get('amount')),people:people};if(editItem)openBill.items=openBill.items.map(x=>x.id===i.id?i:x);else openBill.items.push(i);save();$('#itemDialog').close();showReceipt(openBill.id)});$('#peopleForm').addEventListener('submit',e=>{e.preventDefault();let p=new FormData(e.target).get('person').trim();if(!p)return;if(state.people.includes(p))return toast('该成员已经存在');state.people.push(p);save();e.target.reset();$('#peopleDialog').close();render()});$('#tripForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('tripName').trim(),dates=f.get('tripDates').trim();if(!name)return toast('请输入旅行名称');if(editingTripId){let t=state.trips.find(x=>x.id===editingTripId);if(t){t.name=name;t.dates=dates||'无备注';}}else{let t={id:crypto.randomUUID(),name,dates:dates||'无备注',people:[],bills:[]};state.trips.push(t);state.activeTrip=t.id;page='people';}save();render();tripDialog.close();if(!editingTripId)$('#peopleDialog').showModal();});$('#personForm').addEventListener('submit',e=>{e.preventDefault();let n=e.target.personName.value.trim();if(!n)return toast('请输入成员名称');if(!editingPerson)return;if(n!==editingPerson&&state.people.includes(n))return toast('该成员已经存在');let pos=state.people.indexOf(editingPerson);state.people[pos]=n;state.bills.forEach(b=>{if(b.payer===editingPerson)b.payer=n;if(b.tipFor===editingPerson)b.tipFor=n;b.items.forEach(i=>i.people=i.people.map(p=>p===editingPerson?n:p))});save();render();personDialog.close();editingPerson=null;});render();
</script><script>
/* CRUD enhancements for trips, people, and bill metadata. */
let editingBill=null;
const baseShowBill=showBill, baseShowReceipt=showReceipt, baseRenderPeople=renderPeople;
showBill=function(b){
  editingBill=b||null; $('#deleteBillFromEdit').hidden=!b; const peopleOptions=state.people.map(p=>`<option>${esc(p)}</option>`).join('');
  $('#payerSelect').innerHTML=peopleOptions; $('#tipSelect').innerHTML='<option value="all">全体成员均分</option>'+peopleOptions;
  $('#billDialogTitle').textContent=b?'编辑账单':'新建账单'; $('#billSubmit').textContent=b?'保存修改':'创建并添加项目';
  if(b){$('#billForm').merchant.value=b.merchant;$('#billForm').payer.value=b.payer;$('#billForm').category.value=b.category;$('#billForm').date.value=b.date||'';$('#billForm').taxRate.value=Number(b.taxRate||0);$('#billForm').tax.value=b.tax;$('#billForm').tip.value=b.tip;$('#billForm').tipFor.value=b.tipFor}
  else{$('#billForm').reset();$('#billForm').date.value=new Date().toISOString().slice(0,10);$('#billForm').taxRate.value=0;$('#billForm').tax.value=0;$('#billForm').tip.value=0}
