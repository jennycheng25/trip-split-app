<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>与鹅同行</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#102b3d"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="与鹅同行"><style>
:root{--ink:#102b3d;--sub:#6e7c85;--bg:#f7f7f3;--card:#fff;--line:#e3e8e4;--green:#197a5b;--mint:#dff5e9;--orange:#f68c50;--soft:#fff2ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:1200px;margin:auto;padding:26px 22px 50px}.top{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:13px;background:var(--ink);display:grid;place-items:center;color:#fff;font-size:21px}.brand{font-size:20px;font-weight:800}.save{margin-left:auto;color:var(--green);font-size:13px}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:24px}.side{padding:17px 12px;height:max-content}.trip-name{font-weight:800;font-size:17px}.dates{font-size:12px;color:var(--sub);margin:6px 0 17px}.nav{width:100%;background:none;color:var(--sub);padding:11px 12px;text-align:left;border-radius:9px;font-weight:700;margin-bottom:3px}.nav.active{background:var(--mint);color:var(--green)}.new{width:100%;padding:11px;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;margin-top:17px}.screen{min-width:0}.hero{border-radius:22px;background:var(--ink);color:#fff;padding:25px 28px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:24px;margin:0}.hero p{margin:7px 0 0;color:#bed0d8;font-size:13px}.hero b{font-size:27px;display:block;text-align:right}.hero span{font-size:12px;color:#bed0d8}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);gap:20px;margin-top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 8px 25px rgba(16,43,61,.045)}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.head h2{font-size:17px;margin:0}.plain{background:none;color:var(--green);font-size:13px;font-weight:800}.bill{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}.bill-top{display:flex;align-items:center;gap:10px}.shop{font-size:21px;width:38px;height:38px;background:var(--soft);border-radius:11px;display:grid;place-items:center}.shop-name{font-weight:800}.meta{font-size:12px;color:var(--sub);margin-top:3px}.bill-total{margin-left:auto;text-align:right;font-weight:800}.bill-total small{font-weight:400;color:var(--sub);display:block;font-size:11px}.chev{color:var(--sub);font-size:18px;margin-left:8px}.hint{font-size:13px;color:var(--sub);text-align:center;padding:28px}.people{display:flex;gap:7px}.av{width:29px;height:29px;border-radius:50%;display:inline-grid;place-items:center;background:#f8d9c6;font-size:12px;font-weight:800}.av:nth-child(2n){background:#d9eceb}.av:nth-child(3n){background:#e6dbf2}.balance{padding:14px 0;border-bottom:1px solid var(--line)}.balance:last-child{border:0}.brow{display:flex;align-items:center;gap:8px}.brow strong{font-size:14px}.net{margin-left:auto;font-size:13px;font-weight:800}.owed{color:#bd573e}.gets{color:var(--green)}.bar{height:6px;border-radius:5px;background:#eef0ec;margin:9px 0 4px}.bar i{display:block;height:100%;border-radius:5px;background:var(--green)}.detail{font-size:11px;color:var(--sub)}.settle{background:var(--mint);border-radius:14px;padding:16px;margin-top:18px}.settle h3{font-size:15px;margin:0 0 5px}.settle p{color:#4d7468;font-size:12px;line-height:1.5;margin:0 0 10px}.transfer{background:#fff;border-radius:9px;padding:9px 10px;margin-top:6px;display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700}.transfer b{margin-left:auto;color:var(--green)}.empty{padding:50px 10px;text-align:center;color:var(--sub)}.empty b{display:block;color:var(--ink);margin:8px}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{text-align:left;color:var(--sub);font-size:12px;padding:7px 5px;border-bottom:1px solid var(--line)}.table td{padding:12px 5px;border-bottom:1px solid #f0f1ed}.table td:last-child,.table th:last-child{text-align:right}.pill{display:inline-block;background:#edf6f1;color:var(--green);padding:3px 7px;border-radius:99px;font-size:11px}.back{background:none;padding:0;color:var(--green);font-weight:800;margin-bottom:14px}.receipt-title{font-size:22px;margin:0 0 4px}.receipt-info{font-size:13px;color:var(--sub);margin-bottom:18px}.line{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}.line.total{margin-top:8px;border-top:1px solid var(--line);font-weight:800;font-size:17px}.splitbox{border-top:1px solid var(--line);margin-top:15px;padding-top:15px}.splitbox h3{font-size:15px;margin:0 0 9px}dialog{width:min(560px,calc(100% - 28px));border:0;border-radius:18px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(8,30,43,.48)}.modal{padding:23px}.modal h2{margin:0 0 18px;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800}.field.wide{grid-column:1/-1}input,select{border:1px solid #dbe2dc;border-radius:9px;padding:10px;background:white;color:var(--ink)}.checks{display:flex;gap:8px;flex-wrap:wrap}.check{background:#f2f4f1;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}.check input{margin-right:4px;vertical-align:middle}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.cancel{background:#eef0ed;padding:10px 14px;border-radius:9px;font-weight:800}.submit{background:var(--ink);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800}.danger{color:#bd573e;background:#fff0ed}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.btn-add-item{display:flex;align-items:center;justify-content:center;width:100%;padding:16px;margin:20px 0;background:var(--ink);color:#fff;border:none;border-radius:999px;font-size:18px;font-weight:600;cursor:pointer;box-sizing:border-box}.btn-add-item:active{opacity:.8}@media(max-width:800px){.app{padding:18px 14px}.layout{display:block}.side{display:flex;gap:5px;overflow:auto;padding:12px 0}.trip-name,.dates{display:none}.nav{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr}.hero{padding:21px}.hero b{font-size:22px}.form{grid-template-columns:1fr}}
 </style></head><body><div class="app"><header class="top"><div class="logo">✦</div><div class="brand">与鹅同行</div><select id="tripSwitcher" aria-label="切换旅行"></select><button class="plain" id="editTrip">编辑旅行</button><button class="plain danger" id="deleteTrip">删除旅行</button><div class="save" id="saveStatus">数据已保存在此设备</div></header><div class="layout"><aside class="side"><div class="trip-name" id="tripName">加州海岸线</div><div class="dates" id="tripDates">2026.10.10 — 10.14 · USD</div><button class="nav active" data-page="bills">账单</button><button class="nav" data-page="people">成员</button><button class="nav" data-page="settle">结算</button><button class="new" id="newBill">＋ 新建账单</button><button class="plain" id="newTrip" style="margin:14px 5px 0">＋ 新建旅行</button></aside><main class="screen" id="screen"></main></div></div>
<dialog id="billDialog"><form class="modal" id="billForm"><h2 id="billDialogTitle">新建账单</h2><div class="form"><label class="field wide">商家 / 项目名称<input required name="merchant" placeholder="例如：Old Fisherman's Grotto"></label><label class="field">谁先付款？<select name="payer" id="payerSelect"></select></label><label class="field">类别<select name="category"><option>餐饮</option><option>交通</option><option>门票</option><option>住宿</option><option>其他</option></select></label><label class="field">日期<input name="date" type="date" required></label><label class="field">当地税率（%）<input name="taxRate" type="number" min="0" step="0.001" value="0" placeholder="例如：9.25"></label><label class="field">账单实际税额（$）<input name="tax" type="number" min="0" step="0.01" value="0"></label><label class="field">小费 / 服务费（$）<input name="tip" type="number" min="0" step="0.01" value="0"></label><label class="field">小费承担者<select name="tipFor" id="tipSelect"><option value="all">全体成员均分</option></select></label></div><div class="actions"><button type="button" class="cancel" onclick="billDialog.close()">取消</button><button class="submit" id="billSubmit">创建并添加项目</button></div></form></dialog>
<dialog id="itemDialog"><form class="modal" id="itemForm"><h2 id="itemTitle">添加消费项目</h2><div class="form"><label class="field wide">项目名称<input required name="name" placeholder="例如：Lobster Risotto"></label><label class="field">税前价格（$）<input required name="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></label><label class="field">分摊方式<select name="split" id="splitType"><option value="equal">消费人均分</option><option value="single">一人承担</option></select></label><div class="field wide"><span>消费人</span><div id="personChecks" class="checks"></div></div></div><div class="actions"><button type="button" class="cancel" onclick="itemDialog.close()">取消</button><button class="submit">保存项目</button></div></form></dialog>
<dialog id="peopleDialog"><form class="modal" id="peopleForm"><h2>管理成员</h2><div class="form"><label class="field wide">新增成员<input name="person" placeholder="输入昵称"></label></div><div class="actions"><button type="button" class="cancel" onclick="peopleDialog.close()">关闭</button><button class="submit">添加成员</button></div></form></dialog><dialog id="tripDialog"><form class="modal" id="tripForm"><h2 id="tripDialogTitle">新建旅行</h2><div class="form"><label class="field wide">旅行名称<input name="tripName" placeholder="例如：加州海岸线"></label><label class="field">备注<input name="tripDates" type="text" placeholder="例如：日期/分工/规则/其他"></label></div><div class="actions"><button type="button" class="cancel" onclick="tripDialog.close()">取消</button><button class="submit" id="tripSubmit">保存</button></div></form></dialog><dialog id="personDialog"><form class="modal" id="personForm"><h2 id="personDialogTitle">编辑成员</h2><div class="form"><label class="field wide">成员名称<input name="personName" placeholder="输入昵称"></label></div><div class="actions"><button type="button" class="cancel" onclick="personDialog.close()">取消</button><button class="submit" id="personSubmit">保存</button></div></form></dialog><div id="toast" class="toast"></div>
<script>
const key='travel-split-v1'; let state=JSON.parse(localStorage.getItem(key)||'null')||{people:['鹅友1号','鹅','鹅友2号','鹅友3号'],bills:[{id:'b1',merchant:"Grabb'Jim's",date:'2026-10-12',category:'餐饮',payer:'鹅友1号',tax:16.92,tip:33.23,tipFor:'all',items:[{id:'i1',name:'SCAMPI DI MARE LINGUINE',amount:44,people:['鹅友1号']},{id:'i2',name:'FRUTTI DI MAREROSSO',amount:40,people:['鹅友2号']},{id:'i3',name:'ALOHA FLAME BURGER',amount:29,people:['鹅']},{id:'i4',name:'FILET ROYALE',amount:56,people:['鹅友3号']}]}]};if(!state.trips){state={trips:[{id:crypto.randomUUID(),name:'加州海岸线',dates:'2026.10.10 — 10.14',people:state.people||[],bills:state.bills||[]}],activeTrip:null};state.activeTrip=state.trips[0].id}let trip=()=>state.trips.find(x=>x.id===state.activeTrip)||state.trips[0];Object.defineProperties(state,{people:{get(){return trip().people},set(v){trip().people=v},enumerable:false},bills:{get(){return trip().bills},set(v){trip().bills=v},enumerable:false}});let page='bills',openBill=null,editItem=null;const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(state));$('#saveStatus').textContent='已保存';setTimeout(()=>$('#saveStatus').textContent='数据已保存在此设备',1200)}function total(b){return b.items.reduce((a,i)=>a+i.amount,0)+Number(b.tax)+Number(b.tip)}function taxShare(b,i){let sub=b.items.reduce((a,x)=>a+x.amount,0);return sub?b.tax*i.amount/sub:0}function shares(b){let o=Object.fromEntries(state.people.map(p=>[p,0]));b.items.forEach(i=>{let n=i.people.length||1,each=(i.amount+taxShare(b,i))/n;i.people.forEach(p=>o[p]=(o[p]||0)+each)});let tp=b.tipFor==='all'?state.people:[b.tipFor];tp.forEach(p=>o[p]=(o[p]||0)+b.tip/tp.length);return o}function allData(){let paid=Object.fromEntries(state.people.map(p=>[p,0])),owed=Object.fromEntries(state.people.map(p=>[p,0]));state.bills.forEach(b=>{paid[b.payer]=(paid[b.payer]||0)+total(b);let sh=shares(b);Object.entries(sh).forEach(([p,v])=>owed[p]=(owed[p]||0)+v)});return{paid,owed,net:Object.fromEntries(state.people.map(p=>[p,paid[p]-owed[p]]))}}function transfers(){let {net}=allData(),debt=state.people.filter(p=>net[p]<-.005).map(p=>[p,-net[p]]),credit=state.people.filter(p=>net[p]>.005).map(p=>[p,net[p]]),a=[];while(debt.length&&credit.length){let d=debt[0],c=credit[0],v=Math.min(d[1],c[1]);a.push([d[0],c[0],v]);d[1]-=v;c[1]-=v;if(d[1]<.005)debt.shift();if(c[1]<.005)credit.shift()}return a}
function avatar(p){return `<span class="av">${esc(p)}</span>`}function render(){let t=trip();$('#tripSwitcher').innerHTML=state.trips.map(x=>`<option value="${x.id}" ${x.id===state.activeTrip?'selected':''}>${esc(x.name)}</option>`).join('');$('#tripName').textContent=t.name;$('#tripDates').textContent=(t.dates||'未设置日期')+' · USD';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(page==='bills')renderBills();if(page==='people')renderPeople();if(page==='settle')renderSettle()}function renderBills(){let tripTotal=state.bills.reduce((a,b)=>a+total(b),0);$('#screen').innerHTML=`<section class="hero"><div><h1>${esc(trip().name)}</h1><p>${state.bills.length} 笔账单 · ${state.people.length} 位同行者</p></div><div><span>旅行总开销</span><b>${money(tripTotal)}</b></div></section><section class="grid"><div class="card"><div class="head"><h2>全部账单</h2><button class="plain" id="addBill2">＋ 添加账单</button></div>${state.bills.length?state.bills.slice().reverse().map(b=>`<div class="bill" data-bill="${b.id}"><div class="bill-top"><div class="shop">${b.category==='餐饮'?'🍝':b.category==='交通'?'🚗':b.category==='门票'?'🎟️':'🧾'}</div><div><div class="shop-name">${esc(b.merchant)}</div><div class="meta">${b.date} · ${esc(b.payer)}先付 · ${b.items.length} 项</div></div><div class="bill-total"><small>账单合计</small>${money(total(b))}</div><span class="chev">›</span></div></div>`).join(''):`<div class="empty">还没有账单<b>从第一张收据开始吧</b></div>`}</div><aside class="card"><div class="head"><h2>当前余额</h2><button class="plain" data-go="settle">查看结算</button></div>${balanceHTML()}${settleHTML()}</aside></section>`;$('#addBill2')?.addEventListener('click',showBill);document.querySelectorAll('[data-bill]').forEach(x=>x.onclick=()=>showReceipt(x.dataset.bill));document.querySelector('[data-go]')?.addEventListener('click',()=>{page='settle';render()})}function balanceHTML(){let d=allData(),max=Math.max(...state.people.map(p=>Math.abs(d.net[p])),1);return state.people.map(p=>`<div class="balance"><div class="brow">${avatar(p)}<strong>${esc(p)}</strong><span class="net ${d.net[p]>=0?'gets':'owed'}">${d.net[p]>=0?'应收 ':'应付 '}${money(Math.abs(d.net[p]))}</span></div><div class="bar"><i style="width:${Math.abs(d.net[p])/max*100}%;background:${d.net[p]>=0?'var(--green)':'var(--orange)'}"></i></div><div class="detail">已付 ${money(d.paid[p])} · 应承担 ${money(d.owed[p])}</div></div>`).join('')}function settleHTML(){let t=transfers();return `<div class="settle"><h3>建议这样转账</h3><p>已将所有账单合并，并尽量减少转账次数。</p>${t.length?t.map(x=>`<div class="transfer"><span>${esc(x[0])}</span><span>→</span><span>${esc(x[1])}</span><b>${money(x[2])}</b></div>`).join(''):'<p>大家已经结清。</p>'}</div>`}

transfers=function(){let totals=new Map();state.bills.forEach(b=>{let billShares=shares(b);Object.entries(billShares).forEach(([person,amount])=>{if(person===b.payer||amount<=0)return;let cents=Math.round(amount*100),mapKey=person+'\u0000'+b.payer;totals.set(mapKey,(totals.get(mapKey)||0)+cents)})});return [...totals.entries()].filter(([,cents])=>cents).map(([mapKey,cents])=>{let [from,to]=mapKey.split('\u0000');return[from,to,cents/100]})};
render();
</script><script>
/* Net all bill-by-bill obligations, then match balances with the fewest transfers. */
transfers=function(){let {net}=allData();let balances=state.people.map(person=>({person,cents:Math.round(Number(net[person]||0)*100)}));let rounding=balances.reduce((sum,x)=>sum+x.cents,0);if(rounding){let target=balances.filter(x=>rounding>0?x.cents>0:x.cents<0).sort((a,b)=>Math.abs(b.cents)-Math.abs(a.cents))[0];if(target)target.cents-=rounding}let payers=balances.filter(x=>x.cents<0).map(x=>({person:x.person,cents:-x.cents})),receivers=balances.filter(x=>x.cents>0).map(x=>({person:x.person,cents:x.cents})),result=[];while(payers.length&&receivers.length){let payer=payers[0],receiver=receivers[0],cents=Math.min(payer.cents,receiver.cents);result.push([payer.person,receiver.person,cents/100]);payer.cents-=cents;receiver.cents-=cents;if(payer.cents===0)payers.shift();if(receiver.cents===0)receivers.shift()}return result};
render();
</script><script>
/* Settlement follows the payer on every bill; only identical transfer directions are merged. */
transfers=function(){const grouped=new Map();state.bills.forEach(bill=>{const billShares=shares(bill);Object.entries(billShares).forEach(([consumer,amount])=>{if(consumer===bill.payer||amount<=0)return;const mapKey=consumer+'\u0000'+bill.payer;grouped.set(mapKey,(grouped.get(mapKey)||0)+Math.round(amount*100))})});return [...grouped].filter(([,cents])=>cents>0).map(([mapKey,cents])=>{const [from,to]=mapKey.split('\u0000');return [from,to,cents/100]})};
render();
</script><script>
/* Settlement first lists people, then drills into that person's reimbursements. */

const perPerson=state.people.map(person=>{const rows=all.filter(x=>x[0]===person);return {person,rows,total:rows.reduce((sum,x)=>sum+x[2],0)}});$('#screen').innerHTML=`<section class="hero"><div><h1>旅行结算</h1><p>选择成员，查看该成员应转给哪位账单付款人。</p></div><div><span>待结算总额</span><b>${money(all.reduce((sum,x)=>sum+x[2],0))}</b></div></section><section class="card" style="margin-top:20px"><div class="head"><h2>全部参与者</h2></div>${perPerson.map(entry=>`<button class="bill settlement-person" data-person="${esc(entry.person)}" style="width:100%;text-align:left;background:#fff"><div class="bill-top">${avatar(entry.person)}<div><div class="shop-name">${esc(entry.person)}</div><div class="meta">${entry.rows.length?`需要支付 ${entry.rows.length} 笔`:'当前无需付款'}</div></div><div class="bill-total"><small>待付合计</small>${money(entry.total)}</div><span class="chev">›</span></div></button>`).join('')}</section>`;document.querySelectorAll('.settlement-person').forEach(btn=>btn.onclick=()=>{settlementPerson=btn.dataset.person;render()})};
render();
</script><script>
